[project]
name = "conjectura"
version = "0.1.0"
description = "AI-driven mathematical discovery through computational experimentation, autonomous research agents, symbolic reasoning, and formal verification."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
# Dependencies are added only when an experiment needs them (docs/methodology.md).
dependencies = [
    "jsonschema>=4.23",
    "networkx>=3.7",
    "python-flint>=0.9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "lean: requires the pinned Lean toolchain and a built Mathlib (skipped with a stated reason when unavailable)",
    "slow: exhaustive computation that takes more than a few seconds",
]
